writeQueueSize: 8192
protocols: [tcp, udp]

# webrtcAdditionalHosts: [192.168.1.5, jthogan.com]
webrtcAdditionalHosts: [jthogan.com]
webrtcAllowOrigin: '*'

webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

udpMaxPayloadSize: 1280

# webrtcLocalUDPAddress: :8189 - old option?
webrtcLocalTCPAddress: :8189

pathDefaults:
  runOnReady: ffmpeg -i rtsp://localhost:$RTSP_PORT/$RTSP_PATH -vf fps=1/3 -update 1 -y /img/$MTX_PATH.jpg
  runOnReadyRestart: yes
  runOnNotReady: cp -f /img/source.jpg /img/$MTX_PATH.jpg

paths:

  driveway:
