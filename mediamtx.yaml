  home-cams:
    runOnInit: >
      ffmpeg
        -fflags nobuffer -flags low_delay -use_wallclock_as_timestamps 1
        -rtsp_transport tcp -timeout 10000000 -fflags +genpts
        -thread_queue_size 512 -i rtsp://localhost:$RTSP_PORT/basement
        -thread_queue_size 512 -i rtsp://localhost:$RTSP_PORT/basement2
        -thread_queue_size 512 -i rtsp://localhost:$RTSP_PORT/kids-room
        -thread_queue_size 512 -i rtsp://localhost:$RTSP_PORT/garage
        -filter_complex "
          [0:v]scale=960:540[v0];
          [1:v]scale=960:540[v1];
          [2:v]scale=960:540[v2];
          [3:v]scale=960:540[v3];
          [v0][v1][v2][v3]xstack=inputs=4:layout=0_0|960_0|0_540|960_540:shortest=1, fps=30[v]
        "
        -map "[v]"
        -c:v libx264
          -preset veryfast -tune zerolatency
          -profile:v main -level 3.1
          -pix_fmt yuv420p
          -r 30
          -g 15 -keyint_min 15
          -b:v 2500k -maxrate 2500k -bufsize 2500k
          -bf 0
        -an
        -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH

    runOnInitRestart: yes

  property-cams:
    runOnInit: >
      ffmpeg
        -fflags nobuffer -flags low_delay -use_wallclock_as_timestamps 1
        -rtsp_transport tcp -timeout 10000000 -fflags +genpts
        -thread_queue_size 512 -i rtsp://localhost:$RTSP_PORT/driveway_sub
        -thread_queue_size 512 -i rtsp://localhost:$RTSP_PORT/doorbell_sub
        -thread_queue_size 512 -i rtsp://localhost:$RTSP_PORT/backyard_sub
        -thread_queue_size 512 -i rtsp://localhost:$RTSP_PORT/backyard2_sub
        -filter_complex "
          [0:v]scale=960:540[v0];
          [1:v]scale=960:540[v1];
          [2:v]scale=960:540[v2];
          [3:v]scale=960:540[v3];
          [v0][v1][v2][v3]xstack=inputs=4:layout=0_0|960_0|0_540|960_540:shortest=1, fps=30[v]
        "
        -map "[v]"
        -c:v libx264
          -preset veryfast -tune zerolatency
          -profile:v main -level 3.1
          -pix_fmt yuv420p
          -r 30
          -g 15 -keyint_min 15
          -b:v 2500k -maxrate 2500k -bufsize 2500k
          -bf 0
        -an
        -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH

    runOnInitRestart: yes

  all-cams:
