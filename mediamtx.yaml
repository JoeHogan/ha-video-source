      ffmpeg -hwaccel vaapi -rw_timeout 10000000 -i rtmp://192.168.1.25/bcs/channel0_main.bcs?channel=0&stream=0&user=admin&password=Treadonmydreams1$
        -c:v copy -bf 0
        -c:a libopus
        -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes

  driveway_sub:
